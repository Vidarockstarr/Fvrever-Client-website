
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09080d">
  <title>FVREVER | Dashboard Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, #52202f 0%, transparent 48%),
        linear-gradient(145deg, #100c14, #08080c 65%);
      color: #fff;
      font-family: Inter, Arial, sans-serif;
    }

    .login {
      width: 100%;
      max-width: 430px;
      padding: 42px;
      background: rgba(20, 17, 25, .94);
      border: 1px solid rgba(255, 130, 166, .2);
      border-radius: 22px;
      box-shadow: 0 25px 100px rgba(0, 0, 0, .5);
    }

    .logo {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 19px;
      background: linear-gradient(135deg, #ff82a6, #d92e64);
      color: #180810;
      font-size: 28px;
      font-weight: 950;
      box-shadow: 0 8px 35px #e83c7540;
    }

    .eyebrow {
      color: #ff82a6;
      font-size: 10px;
      letter-spacing: 4px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #918895;
      font-size: 13px;
      margin-bottom: 35px;
      line-height: 1.6;
    }

    label {
      display: block;
      color: #c9c0ce;
      font-size: 12px;
      font-weight: 700;
      margin: 20px 0 9px;
    }

    input {
      width: 100%;
      padding: 15px;
      background: #0d0b11;
      color: white;
      border: 1px solid #302631;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      transition: .2s;
    }

    input:focus {
      border-color: #ff82a6;
      box-shadow: 0 0 0 3px #ff82a61c;
    }

    button {
      width: 100%;
      margin-top: 27px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(100deg, #ff91b0, #e13b70);
      color: #200b13;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
      box-shadow: 0 8px 28px #e83c7540;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    #message {
      min-height: 20px;
      margin-top: 17px;
      text-align: center;
      font-size: 12px;
      color: #ff819e;
    }

    .footer {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #302631;
      color: #77707d;
      text-align: center;
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #a69aa9;
      font-size: 12px;
      text-decoration: none;
    }

    .back:hover {
      color: #ff91b0;
    }

    @media(max-width: 480px) {
      .login {
        padding: 30px 23px;
      }
    }
  </style>
</head>

<body>
  <main class="login">
    <div class="logo">F</div>

    <div class="eyebrow">FVREVER CLIENT</div>
    <h1>ADMIN DASHBOARD</h1>

    <p class="subtitle">
      Welcome back. Sign in to access your administration panel.
    </p>

    <form id="loginForm">
      <label for="username">USERNAME</label>
      <input
        id="username"
        name="username"
        type="text"
        placeholder="Enter your username"
        autocomplete="username"
        maxlength="100"
        required
      >

      <label for="password">PASSWORD</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        maxlength="1024"
        required
      >

      <button id="submitButton" type="submit">
        ACCESS DASHBOARD →
      </button>

      <div id="message" role="status" aria-live="polite"></div>
    </form>

    <a class="back" href="/">← BACK TO FVREVER WEBSITE</a>

    <div class="footer">
      FVREVER CLIENT · PRIVATE ACCESS
    </div>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    async function checkSession() {
      try {
        const response = await fetch("/api/me", {
          cache: "no-store",
          credentials: "same-origin"
        });

        if (response.ok) {
          window.location.replace("/admin.html");
        }
      } catch (error) {
        console.error("Session check failed.");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "AUTHENTICATING...";
      message.textContent = "";

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "same-origin",
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Login failed.");
        }

        message.style.color = "#8ce5b0";
        message.textContent = "Access granted. Redirecting...";

        window.location.replace("/admin.html");

      } catch (error) {
        message.style.color = "#ff819e";
        message.textContent = error.message || "Unable to connect.";

        button.disabled = false;
        button.textContent = "ACCESS DASHBOARD →";
      }
    });

    checkSession();
  </script>
</body>
</html>
